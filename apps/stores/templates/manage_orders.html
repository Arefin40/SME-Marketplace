{% extends "layouts/dashboard_layout.html" %}

{% block slot %}
   <header class="space-y-3">
      <h2 class="text-foreground text-xl font-bold leading-tight">Orders</h2>
      <p>View, process, and fulfill customer orders</p>
   </header>

   <div class="mt-10 flex items-center justify-between gap-x-4 text-sm">
      <div class="flex items-center p-1 rounded-lg bg-gray-100 gap-x-1 font-semibold">
         <a href="{% url 'manage-orders' %}"
            class="px-3 py-1 rounded-md {% if request.GET.show == 'all' or not request.GET.show %}bg-white text-foreground{% endif %} hover:bg-gray-200">All Orders</a>
         <a href="{% url 'manage-orders' %}?show=today"
            class="px-3 py-1 rounded-md {% if request.GET.show == 'today' %}bg-white text-foreground{% endif %} hover:bg-gray-200">Today</a>
      </div>
      <div class="max-w-96 w-full">
         <form method="get" action="{% url 'manage-orders' %}">
            <input type="text"
                   name="q"
                   value="{{ request.GET.q }}"
                   autocomplete="off"
                   placeholder="Search by order ID"
                   class="w-full h-10 border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 rounded-md" />
         </form>
      </div>
   </div>

   <main class="mt-10 grid grid-cols-4 gap-5">
      {% for i in "12345678" %}
         <div class="p-3 border rounded-lg text-sm">
            <div class="flex justify-between items-center">
               <div class="space-y-1">
                  <h6 class="text-foreground font-semibold">Customer name</h6>
                  <p>#128676</p>
               </div>
               <p class="bg-sky-100 text-sky-600 rounded-full px-2.5 py-2 text-xs font-semibold">New Order</p>
            </div>

            <div class="mt-3 pt-3 border-t-2 border-gray-100 space-y-4">
               <div class="flex items-center gap-x-2.5">
                  <svg xmlns="http://www.w3.org/2000/svg"
                       fill="none"
                       stroke="currentColor"
                       stroke-width="1.5"
                       stroke-linecap="round"
                       stroke-linejoin="round"
                       class="size-5 stroke-current"
                       viewBox="0 0 24 24">
                     <path d="M8 2v4M16 2v4" />
                     <rect width="18" height="18" x="3" y="4" rx="2" />
                     <path d="M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01" />
                  </svg>
                  <p>2024-10-15</p>
               </div>

               <div class="flex justify-between text-foreground">
                  <p>3 items</p>
                  <p class="font-semibold">7300 BDT</p>
               </div>
            </div>
         </div>
      {% endfor %}
   </main>
{% endblock slot %}
