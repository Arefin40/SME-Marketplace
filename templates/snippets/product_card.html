<div class="rounded-lg space-y-3">
   <div class="relative rounded-lg group overflow-hidden">
      <a href="{% url 'product_details' product.id %}" class="w-full h-full">
         <img class="rounded-lg object-cover"
              height="512"
              width="512"
              src="{{ product.image.url }}"
              alt="{{ product.name }}" />
      </a>
      <a href="{% url 'toggle-wishlist' product.id %}"
         class="size-6 block absolute top-3 right-3 z-10 hover:scale-110 transition-transform">
         {% if product.id in wishlist_products %}
            {% include "icons/love_sign.html" with active=True %}
         {% else %}
            {% include "icons/love_sign.html" %}
         {% endif %}
      </a>

      <div class="absolute left-1/2 -translate-x-1/2 top-full group-hover:-translate-y-12 transition-all duration-300 flex items-center gap-x-1">
         <a href="{% url 'store' product.collection.store.slug %}"
            class="p-3 py-2 bg-white/75 backdrop-blur-sm rounded-full flex items-center gap-x-1 text-sm text-foreground flex-shrink-0">
            <img width="20"
                 height="20"
                 src="{{ product.collection.store.logo.url }}"
                 alt="{{ product.collection.store.name }}"
                 class="size-5 rounded-full" />
            <p>{{ product.collection.store.name }}</p>
         </a>
         <a href="{% url 'add-to-cart' product.id %}"
            class="p-3 py-2 bg-white/75 backdrop-blur-sm rounded-full flex items-center gap-x-1 text-sm text-foreground flex-shrink-0">
            {% include "icons/ShoppingCart.html" %}
         </a>
      </div>
   </div>

   <div class="flex flex-col gap-y-1 text-sm justify-between font-semibold">
      <a href="{% url 'product_details' product.id %}"
         class="font-semibold text-foreground truncate">{{ product.name }}</a>
      <div class="flex items-center justify-between">
         <p>
            ৳<span class="font-semibold text-foreground">{{ product.price }}</span>
         </p>
      </div>
   </div>
</div>
